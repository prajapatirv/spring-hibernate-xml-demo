# Primary (remote) database. Leave SUPABASE_DB_URL unset to always use H2.
# If it is unset or unreachable (e.g. no internet), the app falls back to H2 below.
primary.driver=org.postgresql.Driver
primary.url=${SUPABASE_DB_URL:}
primary.username=${SUPABASE_DB_USER:}
primary.password=${SUPABASE_DB_PASSWORD:}

# Fallback: H2 in memory (works offline)
fallback.driver=org.h2.Driver
fallback.url=jdbc:h2:mem:xmldemo;DB_CLOSE_DELAY=-1
fallback.username=sa
fallback.password=
